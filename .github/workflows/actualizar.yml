name: Actualizar altura del río

on:
  schedule:
    - cron: "17 * * * *"      # cada hora, al minuto 17 (evita los picos de :00 y :30)
  workflow_dispatch: {}       # también se puede correr a mano desde la pestaña Actions

permissions:
  contents: write

concurrency:
  group: actualizar-datos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Leer la fuente oficial y actualizar datos.json
        run: python scripts/actualizar.py
      - name: Guardar cambios si los hay
        run: |
          git config user.name "actualizacion-automatica"
          git config user.email "actions@users.noreply.github.com"
          git add datos.json
          if git diff --cached --quiet; then
            echo "Sin cambios."
          else
            git commit -m "Actualizar lectura del río ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push
          fi
